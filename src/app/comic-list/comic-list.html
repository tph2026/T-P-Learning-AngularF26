<div class="comic-list">

  <!-- IMPORTANT: when changing "defaultCategory" key name in the "comic-config.ts" and "app.config.ts"
  must restart ng serve in order to see changes -->
  <button (click)="onShounenToggled();"> Click to filter by <b>{{ filter.defaultGenre }}</b> </button>

  <!-- IMPORTANT: when using service injection/signal in comic-list.ts, change "comicList" -> "comicList()" -->
  @for (comic of comicList(); track comic.id; let index = $index; let first = $first; let last = $last; let count = $count) {
    <!--    @if (first){ <p style="color: green; font-weight: bolder">You have reached the beginning.</p> } -->
    <!-- display total at the top only -->
    @if (index == 0) { <p>DISPLAYING {{ count }} COMICS</p> }
    <app-comic-list-item
      [comic]="comic"
      [class.even]="(index+1) % 2 === 0"
      [class.first]="first"
      [class.last]="last"
      (opened)="onComicOpened($event)"
    >
    </app-comic-list-item>
<!--    @if (last){ <p style="color: red;">You have reached the end...</p> }-->
  }
  @empty {
    <p>No comics to show.</p>
  }
  <!-- Button to readd back all the comics -->
  <button (click)="onButtonClicked();"> Click here to add back removed comics </button>

</div>
