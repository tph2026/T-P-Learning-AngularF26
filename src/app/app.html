

<div class="container">
  <h1>{{ title }}</h1>

  <nav class="nav-bar">
    <!-- exact: true stops "All comics" from also being highlighted on /comics/genre/shounen.
         By default, routerLinkActive matches by prefix. -->
    <a routerLink="/comics" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">All comics</a>
    <a routerLink="/comics/genre/shounen" routerLinkActive="active">Shounen</a>
    <a routerLink="/comics/genre/action" routerLinkActive="active">Action</a>
    <a routerLink="/comics/genre/thriller" routerLinkActive="active">Thriller</a>
    <a routerLink="/favourites" routerLinkActive="active">Favourites ({{ favouriteCount() }})</a>
    <a routerLink="/add" routerLinkActive="active">Add comic</a>
    <!-- TOGGLE SECTION -->
    @if (comicState.editEnable()) {
      <button id="lock-btn" (click)="comicState.editToggle()">Lock Editing</button>
    } @else {
      <button id="lock-btn" (click)="comicState.editToggle()">Enable Editing</button>
    }
  </nav>

  <!-- The page for the matched route is displayed here. -->
  <router-outlet />

</div>
